<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Parevo Flow Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Production-ready workflow orchestration engine for Go applications. Dual-language (EN/TR) documentation.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Premium Dark Theme stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/themeable/themes/dark.css">
  
  <!-- Custom variables for high-fidelity aesthetics -->
  <style>
    :root {
      --theme-color: #10b981; /* emerald accent */
      --base-font-family: 'Inter', system-ui, -apple-system, sans-serif;
      --code-font-family: 'JetBrains Mono', 'Fira Code', monospace;
      --sidebar-width: 280px;
      --content-max-width: 900px;
      --mono-hue-base: 220; /* custom slate background hues */
      --background: #0f172a;
      --sidebar-background: #0b0f19;
    }
    
    /* Code block styling enhancements */
    pre[class*="language-"] {
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      background-color: #0b0f19 !important;
    }
    
    /* Custom language switcher button */
    .lang-switcher {
      position: fixed;
      top: 15px;
      right: 80px;
      z-index: 100;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid var(--theme-color);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    
    .lang-switcher:hover {
      background: var(--theme-color);
      color: #000;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">Loading documentation...</div>
  
  <!-- Bilingual dynamic language button -->
  <a id="langBtn" class="lang-switcher" href="#/">TR / EN</a>

  <script>
    window.$docsify = {
      name: 'Parevo Flow',
      repo: 'https://github.com/parevo/flow',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      
      // Search configuration
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: {
          '/tr/': 'Dokümantasyonda ara...',
          '/': 'Search documentation...'
        },
        noData: {
          '/tr/': 'Sonuç bulunamadı!',
          '/': 'No results found!'
        },
        depth: 4
      },
      
      // Copy code configuration
      copyCode: {
        buttonText: {
          '/tr/': 'Kopyala',
          '/': 'Copy'
        },
        errorText: {
          '/tr/': 'Hata',
          '/': 'Error'
        },
        successText: {
          '/tr/': 'Kopyalandı!',
          '/': 'Copied!'
        }
      }
    };

    // Watch hash routing to update language toggle button text and destination
    function updateLangButton() {
      const btn = document.getElementById('langBtn');
      const hash = window.location.hash;
      if (hash.startsWith('#/tr/')) {
        btn.textContent = 'English 🇬🇧';
        btn.href = '#/';
      } else {
        btn.textContent = 'Türkçe 🇹🇷';
        btn.href = '#/tr/';
      }
    }
    window.addEventListener('hashchange', updateLangButton);
    window.addEventListener('DOMContentLoaded', updateLangButton);
  </script>

  <!-- Docsify Core and Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-themeable@0"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Syntax Highlighters for workflow code blocks -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
